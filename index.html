<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Professional To-Do</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>TaskFlow</h1>
                <p class="subtitle">Organize your work, effortlessly.</p>
            </div>
            <div class="header-icon">
                <i class="ph ph-check-circle"></i>
            </div>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <form id="todo-form" class="todo-form">
                <div class="input-wrapper">
                    <i class="ph ph-plus icon-plus"></i>
                    <input 
                        type="text" 
                        id="task-input" 
                        class="task-input" 
                        placeholder="What needs to be done?" 
                        autocomplete="off" 
                        required
                    />
                </div>
                <button type="submit" class="add-btn">
                    <span>Add Task</span>
                </button>
            </form>
        </section>

        <!-- Filters -->
        <section class="filters-section">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </section>

        <!-- Task List -->
        <section class="list-section">
            <ul id="task-list" class="task-list">
                <!-- Tasks will be injected here dynamically -->
            </ul>
            
            <div id="empty-state" class="empty-state hidden">
                <i class="ph ph-coffee empty-icon"></i>
                <p>No tasks found. You're all caught up!</p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-stats">
                <span id="task-count">0</span> task(s) remaining
            </div>
            <button id="clear-completed-btn" class="clear-btn hidden">
                <i class="ph ph-trash"></i> Clear Completed
            </button>
        </footer>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
